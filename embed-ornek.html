<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Kripto Atlası — gömme örneği</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6}.host{max-width:1200px;margin:24px auto;padding:0 16px}p{color:#555}</style></head>
<body><div class="host">
<p>Bu sayfa, Kripto Atlası'nın başka bir siteye nasıl gömüleceğini gösteren örnektir.</p>

<!-- ▼ Stablex sitesine eklenecek kod ▼ -->
<iframe id="stablex-atlas" src="https://esr4ak.github.io/stablex-kripto-atlasi/?embed=1"
        title="Stablex Kripto Atlası" loading="lazy"
        style="width:100%;height:1400px;border:0;display:block;"></iframe>
<script>
  window.addEventListener('message', function (e) {
    if (e.origin !== 'https://esr4ak.github.io') return;
    if (e.data && e.data.type === 'stablex-atlas-height') {
      document.getElementById('stablex-atlas').style.height = e.data.height + 'px';
    }
  });
</script>
<!-- ▲ Stablex sitesine eklenecek kod ▲ -->

</div></body></html>
